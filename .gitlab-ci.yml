ci_test_v1:
  stage: test
  script:
    - echo "🖊️ Styl2 test v1: echo výdech paměti"
ci_test_v2:
  stage: test
  script:
    - echo "🐍 Test v2: Spouštíme"
    - python agent.py
ci_test_v3:
  stage: test
  before_script:
    - pip install python-dotenv
  script:
    - echo "🔐 Test v3: Načítám CI proměnné"
    - python -c "from dotenv import load_dotenv; import os; load_dotenv(); print('CI_TOKEN:', os.getenv('CI_TOKEN')); print('AGENT_MODE:', os.getenv('AGENT_MODE')); print('MEAI_SHERIFF:', os.getenv('MEAI_SHERIFF'))"
ci_test_v4:
  stage: test
  script:
    - echo "📡 Styl2 CI výdech v4 aktivován"
    - curl -H "Content-Type: application/json" -X POST \
      -d "{\"content\": \"🎩 CI Styl2 výdech v4: agent $MEAI_SHERIFF • režim: $AGENT_MODE • token: $(if [ -z \"$CI_TOKEN\" ]; then echo 'NE'; else echo 'ANO'; fi)\"}" "$DISCORD_WEBHOOK_URL"
  when: on_success
  tags: [shell]
ci_test_v5:
  stage: test
  script:
    - echo "🧪 Spouštím agent_v2.py"
    - python agent_v2.py
ci_test_v6:
  stage: test
  script:
    - echo "📢 CI výdech aktivován"
    - curl -H "Content-Type: application/json" -X POST \
      -d "{\"content\": \"🎩 Výpravce: $MEAI_SHERIFF • Režim: $AGENT_MODE • Token: $(if [ -z \"$CI_TOKEN\" ]; then echo 'NE'; else echo 'ANO'; fi)\"}" "$DISCORD_WEBHOOK_URL"
  when: on_success
