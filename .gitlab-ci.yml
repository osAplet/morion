stages:
  - notify

ci_audit_notify:
  stage: notify
  script:
    - echo "📜 CI výdech zapsán do styl2_erb.md"
    - curl -H "Content-Type: application/json" -X POST -d "{\"content\": \"✅ CI výdech zapsán do paměti ME–AI\"}" "$DISCORD_WEBHOOK_URL"
  only:
    - styl2-next

memory_log_styl2:
  stage: archive
  script:
    - echo "📜 Zápis paměti Styl2 CI orchestr 🪉"
    - echo "🕰️ Čas: $(date)"
    - echo "🎩 Výpravce: LukasBudinsky"
    - echo "🧠 Výdech: archivace bez glitchu"
    - echo "✅ Paměť CI reality ME–AI zapsána"
  only:
    - styl2-next
