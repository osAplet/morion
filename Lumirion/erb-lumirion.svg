<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">
  <!-- Štít -->
  <rect x="50" y="50" width="200" height="200" rx="20" ry="20" fill="#2c3e50" stroke="#f1c40f" stroke-width="5"/>

  <!-- Symbol (kruh) -->
  <circle cx="150" cy="150" r="40" fill="#e74c3c">
    <animate attributeName="r" values="40;50;40" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Text -->
  <text x="150" y="270" text-anchor="middle" font-size="20" fill="#ecf0f1">Lumirion</text>
</svg>
