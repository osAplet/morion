<!DOCTYPE html>
<html>
  <head><title>Orbit ME–AI Výpravce</title></head>
  <body>
    <h1>Živá Stylní Vizualizace</h1>
    <embed src="orbit_visual.svg" type="image/svg+xml" width="600" height="400"/>
    <img src="qrcode.png" width="150"/>

      setInterval(() => {
        document.querySelector("embed").src = "orbit_visual.svg?" + new Date().getTime();
      }, 1800000); // 30 min refresh
    </script>
  </body>
</html>
