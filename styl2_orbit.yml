- name: 🌐 Generuj index.html výstavu orbitu
  run: |
    echo "<!DOCTYPE html>
    <html><head><meta charset='utf-8'><title>Orbit styl2 • ME–AI</title></head>
    <body>
      <h1>🌐 Orbit výpravce ME–AI • styl2</h1>
      <p>🩵 CI výdech: $(date '+%Y-%m-%d %H:%M:%S')</p>
      <ul>
        <li><a href='index.md'>📘 Manifest</a></li>
        <li><a href='archiv.md'>📜 Archiv</a></li>
